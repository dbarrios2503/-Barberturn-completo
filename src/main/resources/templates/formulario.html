<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Acta</title>
</head>
<body>
    <h1>Formulario de Acta de Entrega</h1>

    <form action="/generar-acta" method="post">
        <label>Nombre del Equipo:</label><br>
        <input type="text" name="nombreEquipo" required><br><br>

        <label>Nro. De Serie:</label><br>
        <input type="text" name="numeroSerie" required><br><br>

        <label>Cargo:</label><br>
        <input type="text" name="cargo" required><br><br>

        <label>Jefe Inmediato:</label><br>
        <input type="text" name="jefeInmediato" required><br><br>

        <label>Marca:</label><br>
        <input type="text" name="marca" required><br><br>

        <label>Modelo:</label><br>
        <input type="text" name="modelo" required><br><br>

        <label>Área:</label><br>
        <input type="text" name="area" required><br><br>

        <label>Responsable:</label><br>
        <input type="text" name="responsable" required><br><br>

        <label>Observaciones:</label><br>
        <textarea name="observaciones" required></textarea><br><br>

        <label>Ciudad:</label><br>
        <input type="text" name="ciudad" required><br><br>

        <label>Día:</label><br>
        <input type="text" name="dia" required><br><br>

        <label>Mes:</label><br>
        <input type="text" name="mes" required><br><br>

        <label>Año:</label><br>
        <input type="text" name="anio" required><br><br>

        <button type="submit">Generar Acta</button>
    </form>
</body>
</html>
